<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration Entreprise & Borne</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background: #fff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 400px;
        }

        h1 {
            margin-bottom: 25px;
            font-size: 1.4rem;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        .btn {
            display: block;
            width: 100%;
            background-color: #e0e0e0;
            color: #000;
            border: none;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background-color: #d0d0d0;
        }

        .btn:active {
            background-color: #bcbcbc;
        }

        .message {
            color: green;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .hidden {
            display: none;
        }

        .options-group {
            text-align: left;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Configuration</h1>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="message">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input class="input-field" type="text" name="nom_societe" placeholder="Nom de l'entreprise" value="{{ nom_societe }}" required>
            <input class="input-field" type="number" name="numero_borne" placeholder="Numéro de la borne" value="{{ numero_borne }}" required>

            <div class="options-group">
                <label><input type="checkbox" id="pointeuse" onchange="toggleExclusive('pointeuse')"> Pointeuse</label><br>
                <label><input type="checkbox" id="lecteur" onchange="toggleExclusive('lecteur')"> Lecteur Carte</label><br>
                <label><input type="checkbox" id="tourniquet" onchange="toggleTourniquet()"> Tourniquet</label>
            </div>

            <!-- Champs Pointeuse -->
            <input type="hidden" id="pointeuse_val" name="pointeuse_val">
            <input class="input-field hidden" type="text" id="ip_pointeuse" name="ip_pointeuse" placeholder="Adresse IP">

            <!-- Champs Lecteur Carte -->
            <input type="hidden" id="lecteur_val" name="lecteur_val">
            <input class="input-field hidden" type="number" id="gpio1" name="gpio1" placeholder="GPIO 1">
            <input class="input-field hidden" type="number" id="gpio2" name="gpio2" placeholder="GPIO 2">

            <!-- Champ Tourniquet -->
            <input type="hidden" id="tourniquet_val" name="tourniquet_val">
            <input class="input-field hidden" type="number" id="gpio_tourniquet" name="gpio_tourniquet" placeholder="GPIO Tourniquet">

            <button class="btn" type="submit">💾 Enregistrer</button>
                <script>
                    document.querySelector("form").addEventListener("submit", function() {
                    document.getElementById("pointeuse_val").value = document.getElementById("pointeuse").checked ? 1 : 0;
                    document.getElementById("lecteur_val").value = document.getElementById("lecteur").checked ? 1 : 0;
                    document.getElementById("tourniquet_val").value = document.getElementById("tourniquet").checked ? 1 : 0;
                        });
                </script>
        </form>

        <button class="btn" onclick="location.href='/configuration'">⬅️ Retour</button>
    </div>

    <script>
        function toggleExclusive(selected) {
            const pointeuse = document.getElementById('pointeuse');
            const lecteur = document.getElementById('lecteur');
            const ipField = document.getElementById('ip_pointeuse');
            const gpio1 = document.getElementById('gpio1');
            const gpio2 = document.getElementById('gpio2');

            // Exclusivité
            if (selected === 'pointeuse') {
                lecteur.checked = false;
            } else {
                pointeuse.checked = false;
            }

            // Affichage des champs
            ipField.classList.toggle('hidden', !pointeuse.checked);
            gpio1.classList.toggle('hidden', !lecteur.checked);
            gpio2.classList.toggle('hidden', !lecteur.checked);
        }

        function toggleTourniquet() {
            const tourniquet = document.getElementById('tourniquet');
            const gpioTourniquet = document.getElementById('gpio_tourniquet');
            gpioTourniquet.classList.toggle('hidden', !tourniquet.checked);
        }
    </script>
</body>
</html>
